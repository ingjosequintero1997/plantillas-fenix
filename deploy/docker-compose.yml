services:
  backend:
    image: josequintero1997/plantillas-fenix:latest
    container_name: fenix-backend
    ports:
      - "7000:7000"
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: always
